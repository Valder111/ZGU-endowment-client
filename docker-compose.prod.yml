name: zgu-endowment-client
# prod compose file for client
services:
  web:
    image: zgu-endowment-client:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        BASE_PATH: ${BASE_PATH:-/}
    env_file:
      - path: .env
        required: false
    ports:
      - '10.10.10.44:8088:80'
    restart: unless-stopped
